<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bronx: Displacement and Mobility</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; }
    .title-card {
      position: absolute; top: 14px; left: 14px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3); max-width: 320px;
    }
    .title-card h1 { margin: 0 0 4px; font-size: 1.1rem; }
    .title-card p  { margin: 0; font-size: 0.85rem; color: #444; }
    .popup-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
    .popup-date { color: #666; font-size: 0.82rem; margin-bottom: 6px; }
    .popup-desc { font-size: 0.9rem; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="title-card">
    <h1>The Bronx: Displacement and Mobility</h1>
    <p>A study of migration and displacement in the Bronx from the 1940s to 19070s.</p>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  const MAIN_PLACE = "Cross-Bronx Expressway";
  const START_ZOOM = 10;
  const CLICK_ZOOM = 16;

  const data = {
    "type": "FeatureCollection",
    "features": [
      {"type":"Feature","properties":{ "Name": "Cross-Bronx Expressway","Date": "1948","Description": "The Cross-Bronx Expressway, built in 1948, led to mass displacement and a significant demographic shift within the Bronx."},"geometry": { "type": "LineString", "coordinates": [[-73.928158,40.845485],[-73.92525,40.844796],[-73.912322,40.845194],[-73.901357,40.844505],[-73.892522,40.843478],[-73.891675,40.843303],[-73.881278,40.837827],[-73.879622,40.837098],[-73.877928,40.836632],[-73.872074,40.836224],[-73.867887,40.835578],[-73.848112,40.829544],[-73.844769,40.828508]] }},
      {"type":"Feature","properties":{"Name": "East Tremont", "Date": "1960s","Description": "Historic, vibrant neighborhood that was a hotspot for Jewish, Italian, and Irish families."},"geometry": { "type": "Point", "coordinates": [-73.900856,40.847663]}},
      {"type":"Feature","properties":{"Name": "Crotona Park", "Date": "1963","Description": "Crotona Park was a historic green space that had a portion cut off due to the construction of the Expressway, decreasing the park from its original 155 acres."},"geometry": { "type": "Point", "coordinates": [-73.895478,40.838557]}},
      {"type":"Feature","properties":{"Name":"Yankee Stadium","Date":"1977","Description":"The infamous quote \"The Bronx is burning\" (in reference to the insurance fraud arson epidemic) was spoken during a broadcast of the 1977 World Series, held at Yankee Stadium. The Bronx burning around it was visible from the stadium."},"geometry":{"type":"Point","coordinates":[-73.926885,40.829392]}},
      {"type":"Feature","properties":{"Name":"South Bronx","Date":"1970s","Description":"South Bronx was beset by arson in the 1970s, losing 80% of its housing stock and causing massive displacement."},"geometry":{"type":"Polygon","coordinates":[[[-73.932866,40.809064],[-73.926987,40.802552],[-73.911933,40.796474],[-73.902614,40.805048],[-73.890858,40.806134],[-73.884263,40.801793],[-73.878958,40.802769],[-73.876234,40.801033],[-73.871933,40.801467],[-73.868492,40.806568],[-73.871933,40.813187],[-73.881682,40.817961],[-73.884549,40.822735],[-73.884406,40.828919],[-73.932579,40.83673],[-73.933582,40.833259],[-73.933009,40.827184],[-73.931862,40.821542],[-73.931862,40.821216]]]}},
      {"type":"Feature","properties":{"Name":"Yonkers","Date":"1960s","Description":"The more well-to-do residents of the Bronx moved to Yonkers in response to the displacement from the Expressway and as a reaction to more people of color moving into the Bronx."},"geometry":{"type":"Point","coordinates":[-73.899904,40.931031]}},
      {"type":"Feature","properties":{"Name":"Harlem","Date":"1960s","Description":"In the 1960s, many Black families moved from Harlem to the Bronx."},"geometry":{"type":"Point","coordinates":[-73.945644,40.808013]}},
      {"type":"Feature","properties":{"Name":"Co-Op City","Date":"1960s","Description":"Many Jewish and Italian families moved to Co-op City in response to displacement from the Expressway being built."},"geometry":{"type":"Point","coordinates":[-73.829626,40.874254]}},
      {"type":"Feature","properties":{"Name":"Manhattan","Date":"1950s","Description":"The destruction of the 3rd Avenue Elevated Line cut off the Bronx from Manhattan, leading to property values plummetting."},"geometry":{"type":"Point","coordinates":[-73.986686,40.758258]}},
      {"type":"Feature","properties":{"Name":"Puerto Rico","Date":"1965","Description":"The passage of the Hart-Celler Act led to widespread immigration to the U.S., with Puerto Rico being a huge source of immigration to the Bronx."},"geometry":{"type":"Point","coordinates":[-66.625785,18.356502]}},
      {"type":"Feature","properties":{"Name":"Foxhurst","Date": "1970s","Description": "Foxhurst was the neighborhood that the 41st Precinct served. In the 70s, over two-thirds of the population of the neighborhood fled."},"geometry": {"type": "Polygon","coordinates": [[[-73.89385,40.834833],[-73.893922,40.834931],[-73.896246,40.8335],[-73.900623,40.822153],[-73.89895,40.821739],[-73.898976,40.821023],[-73.891717,40.82098],[-73.890263,40.820999],[-73.885306,40.822825],[-73.885804,40.828373],[-73.888166,40.829544],[-73.891759,40.830102],[-73.893731,40.834678],[-73.89385,40.834833]]]}},
      {"type": "Feature","properties": {"Name": "Charlotte St. and Boston Rd. Fires","Date": "1970s","Description": "This intersection and the surrounding blocks became the national symbol of urban decay. Charlotte St. alone experienced thousands of fires."},"geometry": {"type": "Polygon","coordinates": [[[-73.893274, 40.83623],[-73.894147, 40.834976],[-73.894147, 40.834976],[-73.893999, 40.832274],[-73.892782, 40.832367],[-73.891693, 40.832703],[-73.893274, 40.83623]]]}},
        {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [
                    -73.892746,
                    40.825626
                ]
            },
            "properties": {
                "label": "1086 Simpson Street - 1086 Simpson Street, Bronx, New York 10459, United States",
                "Name": "\"Fort Apache\" - The 41st Precinct",
                "Date": "1914-1993",
                "Description": "This was the home of the NYPD's 41st Precinct, nicknamed \"Fort Apache\" during the 1970s."
            }
        },
        {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [
                    -73.920155,
                    40.817243
                ]
            },
            "properties": {
                "label": "330 East 150th Street - 330 East 150th Street, Bronx, New York 10451, United States",
                "Name": "Engine Company 41-2",
                "Date": 1974,
                "Description": "Firehouse that was closed on January 17th, 1974."
            }
        },
        {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [
                    -73.92216,
                    40.813088
                ]
            },
            "properties": {
                "label": "341 East 143rd Street - 341 East 143rd Street, Bronx, New York 10454, United States",
                "Name": "Ladder Company 71-2",
                "Date": 1974,
                "Description": "Firehouse that was closed on December 16th, 1974."
            }
        },
        {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [
                    -73.899058,
                    40.846085
                ]
            },
            "properties": {
                "label": "453 East 176th Street - 453 East 176th Street, Bronx, New York 10457, United States",
                "Name": "Ladder Company 27-2",
                "Date": 1972,
                "Description": "Firehouse that was closed on November 6th, 1972."
            }
        },
        {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [
                    -73.908059,
                    40.828227
                ]
            },
            "properties": {
                "label": "491 East 166th Street - 491 East 166th Street, Bronx, New York 10456, United States",
                "Name": "Engine Company 50-2",
                "Date": 1974,
                "Description": "Firehouse that was closed on March 22nd, 1974."
            }
        },
        {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [
                    -73.887734,
                    40.851896
                ]
            },
            "properties": {
                "label": "2225 Belmont Avenue - 2225 Belmont Avenue, Bronx, New York 10457, United States",
                "Name": "Engine Company 88-2",
                "Date": 1972,
                "Description": "Firehouse that was closed on November 22nd, 1972."
            }
          }    
    ]
  };

  const map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  function nameOf(props) { return (props && (props.Name || props.name || props.label)) || ""; }

  let mainLatLng = null;
  const layer = L.geoJSON(data, {
    pointToLayer: function (feature, latlng) {
      const isMain = nameOf(feature.properties) === MAIN_PLACE;
      if (isMain) mainLatLng = latlng;
      return L.circleMarker(latlng, {
        radius: isMain ? 11 : 7,
        fillColor: isMain ? "#c0392b" : "#2c5f8a",
        color: "#ffffff", weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function (feature, lyr) {
      const p = feature.properties || {};
      const name = p.Name || p.name || p.label || "Untitled";
      const date = p.Date || p.date || "";
      const desc = p.Description || p.description || "";
      lyr.bindPopup(
        '<div class="popup-name">' + name + "</div>" +
        (date ? '<div class="popup-date">' + date + "</div>" : "") +
        '<div class="popup-desc">' + desc + "</div>"
      );
      lyr.on("click", function () { if (lyr.getLatLng) map.flyTo(lyr.getLatLng(), CLICK_ZOOM); });
    }
  }).addTo(map);

  if (mainLatLng) { map.setView(mainLatLng, START_ZOOM); }
  else if (layer.getBounds().isValid()) { map.fitBounds(layer.getBounds(), { padding: [40, 40] }); }
  </script>
</body>
</html>
